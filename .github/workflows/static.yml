name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write } # Allow Pages deployment.
concurrency: { group: "pages", cancel-in-progress: false } # Keep one deployment active.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check portfolio.js && node --check script.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: "." } # Upload the complete static site.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
